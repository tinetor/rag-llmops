# RAG stack. A profile chooses the LLM server; both answer at http://llm:8000/v1,
# so the app is the same in both cases.
#
#   docker compose --profile cpu up -d     llama.cpp server, no GPU needed
#   docker compose --profile gpu up -d     vLLM on an NVIDIA GPU
#   docker compose run --rm ingestion      build the index (PDF in ./data)

name: rag-llmops

x-app: &app
  build: .
  image: rag-llmops:local
  environment:
    RAG_CONFIG_OVERLAY: configs/config.docker.yaml
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl; checking the TCP port is enough.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    command: ["--model-id", "BAAI/bge-base-en-v1.5"]
    volumes:
      - tei_data:/data
    healthcheck:
      # The port only opens once the model is loaded.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/80"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  llm-cpu:
    profiles: [cpu]
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - "-hf"
      - "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "-c"
      - "4096"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llm_cpu_models:/models
    networks:
      default:
        aliases: [llm]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  vllm:
    profiles: [gpu]
    image: vllm/vllm-openai:v0.33.0
    command: ["--model", "Qwen/Qwen2.5-0.5B-Instruct", "--host", "0.0.0.0", "--port", "8000"]
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      default:
        aliases: [llm]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 20
      # First start downloads the weights and loads them on the GPU.
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    <<: *app
    restart: unless-stopped
    ports:
      # Bound to localhost only: reach it through an SSH tunnel or a proxy.
      - "127.0.0.1:8080:8080"
    depends_on:
      qdrant:
        condition: service_healthy
      tei:
        condition: service_healthy
      # Only one of the two runs, depending on the profile.
      llm-cpu:
        condition: service_healthy
        required: false
      vllm:
        condition: service_healthy
        required: false

  ingestion:
    <<: *app
    profiles: [tools]
    command: ["python", "run_ingestion.py"]
    volumes:
      - ./data:/app/data:ro
    depends_on:
      qdrant:
        condition: service_healthy
      tei:
        condition: service_healthy

volumes:
  qdrant_data:
  tei_data:
  llm_cpu_models:
  hf_cache:
