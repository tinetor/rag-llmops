data:
  pdf_path: data/ai_act.pdf

chunking:
  max_chars: 180
  overlap_ratio: 0.1
  strategy: "article"

embedding:
  backend: hf              # hf: in-process | tei: Text Embeddings Inference server
  model_name: BAAI/bge-base-en-v1.5
  base_url: http://localhost:8081   # used only by the tei backend
  timeout: 60

retrieval:
  top_k: 8
  mode: hybrid
  candidate_k: 15
  use_router: True
  top_chapters: 2
  route_pool: 30

index:
  persist_dir: ./storage
  collection_name: eu_ai_act


generation:
  backend: http
  model_name: Qwen/Qwen2.5-0.5B-Instruct
  base_url: http://localhost:8000/v1
  api_key: EMPTY
  timeout: 120
  max_retries: 2
  max_new_tokens: 512