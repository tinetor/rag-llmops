data:
  pdf_path: data/ai_act.pdf

chunking:
  max_chars: 180
  overlap_ratio: 0.1
  strategy: "article"

embedding:
  model_name: BAAI/bge-base-en-v1.5

retrieval:
  top_k: 8
  mode: hybrid
  candidate_k: 15
  use_router: True
  top_chapters: 2
  route_pool: 30

index:
  persist_dir: ./storage
  collection_name: eu_ai_act

generation:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  quantization: none
  max_new_tokens: 512
